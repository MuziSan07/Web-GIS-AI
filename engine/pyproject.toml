[project]
name = "planeng"
version = "0.1.0"
description = "AI-assisted spatial planning engine for town development master planning"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "geopandas>=1.0",
    "rasterio>=1.4",
    # networkx and ortools were listed here and never imported. Together they
    # are a large install, which matters on a hosted container with a
    # gigabyte of memory. Add them back the day something uses them.
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "scipy>=1.11",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    # Export formats. Each is the writer for one deliverable the client asked
    # for, and each is pure enough to install without a toolchain.
    "ezdxf>=1.3",          # DXF, for the civil and survey consultants
    "reportlab>=4.0",      # the printed plan set
    "ifcopenshell>=0.8",   # IFC massing model
]

[project.scripts]
planeng = "planeng.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
planeng = ["standards/*.yaml", "web/*.html"]
